version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Raw data, loaded 1:1 from the Olist CSVs (src/ingest/load_csv.py, all columns as text)
      and from the Frankfurter API (src/ingest/ingest_fx.py).
    tables:
      - name: orders
        description: Olist orders, one row per order.
      - name: order_items
        description: Order lines; key (order_id, order_item_id).
      - name: order_payments
        description: Payments per order; key (order_id, payment_sequential).
      - name: order_reviews
        description: Reviews; review_id is NOT unique in the source (the same review appears on several orders).
      - name: customers
        description: Customers; customer_id is per order, customer_unique_id identifies the person.
      - name: products
        description: Product catalogue (the *_lenght columns keep the typo from the original dataset).
      - name: sellers
        description: Sellers.
      - name: geolocation
        description: Coordinates per zip code prefix; several rows per prefix, no key.
      - name: category_translation
        description: Translation of category names from Portuguese to English.
      - name: fx_rates
        description: >
          Daily ECB rates via Frankfurter, business days only; key (rate_date, base, quote).
          Loaded by UPSERT, so _loaded_at reflects the latest ingestion run.
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}
