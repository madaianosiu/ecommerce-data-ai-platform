version: 2

models:
  - name: stg_orders
    description: Orders, with typed timestamps (Brazil local time, no time zone).
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: stg_order_items
    description: Order lines; prices are in BRL.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: order_item_id
        data_tests: [not_null]

  - name: stg_order_payments
    description: Payments per order; values are in BRL.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: payment_sequential
        data_tests: [not_null]

  - name: stg_order_reviews
    description: Reviews. Duplicates on review_id are NOT resolved here (see the test with severity warn).
    columns:
      - name: review_id
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn  # known duplicates in the source, handled in a later stage

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_geolocation
    description: Several coordinates per zip prefix; no primary key.
    columns:
      - name: zip_code_prefix
        data_tests: [not_null]

  - name: stg_category_translation
    columns:
      - name: product_category_name
        data_tests: [unique, not_null]

  - name: stg_fx_rates
    description: Daily rates (ECB business days); 1 base_currency = rate quote_currency.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, base_currency, quote_currency]
    columns:
      - name: rate_date
        data_tests: [not_null]
      - name: base_currency
        data_tests: [not_null]
      - name: quote_currency
        data_tests: [not_null]
      - name: rate
        data_tests: [not_null]
