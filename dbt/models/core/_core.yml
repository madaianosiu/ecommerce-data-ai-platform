version: 2

models:
  # ---------- dimensions ----------
  - name: dim_date
    description: Continuous calendar, from the earliest to the latest date found in orders.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_fx_daily
    description: >
      BRL->EUR rate for every day in dim_date, as-of: the latest ECB rate published on or before that day.
      rate_brl_eur = how many EUR 1 BRL is worth.
    columns:
      - name: date
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: rate_brl_eur
        data_tests: [not_null]
      - name: rate_source_date
        description: Date of the rate actually used (<= date).
        data_tests: [not_null]
      - name: is_filled
        description: true when no rate was published on that day (weekend/holiday).
        data_tests: [not_null]

  - name: dim_customers
    description: >
      One row per real customer (customer_unique_id). customer_id in the source is per order;
      the customer_id -> customer_unique_id mapping is kept in fact_orders.
      The address comes from the customer's most recent order.
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]

  - name: dim_products
    description: Products with translated category; 'unknown' when there is no category, Portuguese name as fallback when there is no translation.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: product_category
        data_tests: [not_null]
      - name: product_category_name_pt
        data_tests: [not_null]

  - name: dim_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  # ---------- facts ----------
  - name: fact_orders
    description: Grain = one order. Status, timestamps and delivery indicators; no amounts.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: order_purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: delivery_days
        description: Calendar days from purchase to delivery to the customer (NULL if not delivered).
      - name: is_late
        description: Delivered after the estimated date (NULL if there is no delivery date).
      - name: has_delivery_date_issue
        description: Status 'delivered' but no order_delivered_customer_at.
        data_tests: [not_null]

  - name: fact_order_items
    description: >
      Grain = order_id + order_item_id. Prices in BRL and EUR (purchase-day rate).

      **Revenue definition:** revenue = sum(price_brl) (or price_eur) from fact_order_items for
      orders whose order_status is not 'canceled' or 'unavailable', i.e. `where is_revenue`.
      Freight is not revenue. Rows of excluded orders stay in the table (nothing is deleted);
      they are only marked is_revenue = false. Payments are not the revenue source: orders paid
      without items are explained in recon_payments_without_items.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, order_item_id]
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: order_item_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: order_purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fx_daily')
                field: date
      - name: price_brl
        data_tests: [not_null]
      - name: price_eur
        data_tests: [not_null]
      - name: order_status
        data_tests: [not_null]
      - name: is_revenue
        description: true if the line counts as revenue (order_status is not canceled or unavailable).
        data_tests: [not_null]

  - name: recon_payments_without_items
    description: >
      Payments vs items reconciliation: one row per order that has payments in fact_payments but no
      row in fact_order_items, with order_status and the amount paid. Explains most of the
      difference between total payments and items + freight. Does not modify or filter the facts.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: order_status
        data_tests: [not_null]
      - name: payment_value_brl
        data_tests: [not_null]

  - name: fact_payments
    description: >
      Grain = order_id + payment_sequential. Kept separate from fact_order_items so that a join
      cannot duplicate revenue. Values in BRL and EUR (purchase-day rate).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, payment_sequential]
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: payment_sequential
        data_tests: [not_null]
      - name: payment_value_brl
        data_tests: [not_null]
      - name: payment_value_eur
        data_tests: [not_null]

  - name: fact_reviews
    description: >
      Grain = review_id + order_id. The same review_id appears on several orders in the source
      (identical content, no exact duplicates), so it is not deduplicated.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [review_id, order_id]
    columns:
      - name: review_id
        data_tests: [not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
